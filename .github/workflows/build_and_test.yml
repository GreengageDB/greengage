name: Docker Build and Push

on:
  #push:
  #  branches: ["main"]
  pull_request:
    paths:
      - 'concourse/scripts/**'
      - 'src/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'ci/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build Docker image
        run: |
          docker build -t "gpdb6_u22:${GITHUB_SHA}" -f ci/Dockerfile.ubuntu .
