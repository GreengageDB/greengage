name: Docker Build and Push

on:
  #push:
  #  branches: ["main"]
  pull_request:
    paths:
      - 'concourse/scripts/**'
      - 'src/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'ci/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build and export
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/Dockerfile.ubuntu
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
          tags: gpdb6_u22:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ github.sha }}.tar

      - # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}.tar
          path: ${{ runner.temp }}/${{ github.sha }}.tar

  regression:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        optimizer: [on, off]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.sha }}.tar
          path: ${{ runner.temp }}

      - name: Regression test with optimizer=${{ matrix.optimizer }}
        run: |
          docker load --input ${{ runner.temp }}/${{ github.sha }}.tar
          docker run --name gpdb6_opt_on --rm -e TEST_OS=centos \
            -e MAKE_TEST_COMMAND="-k PGOPTIONS='-c optimizer=${{ matrix.optimizer }}' installcheck-world" \
            --sysctl 'kernel.sem=500 1024000 200 4096' gpdb6_u22:${{ github.sha }} \
            bash /home/gpadmin/gpdb_src/concourse/scripts/ic_gpdb.bash
