name: Docker Build and Push

on:
  #push:
  #  branches: ["main"]
  pull_request:
    paths:
      - 'concourse/scripts/**'
      - 'src/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'ci/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          submodules: 'recursive'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build and export
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci/Dockerfile.ubuntu
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true # ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/stolb27/gpdb6_u22:${{ github.sha }}

  regression:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        optimizer: [on, off]

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Regression test with optimizer=${{ matrix.optimizer }}
        run: |
          docker run --name gpdb6_opt_on --rm -e TEST_OS=centos \
            -e MAKE_TEST_COMMAND="-k PGOPTIONS='-c optimizer=${{ matrix.optimizer }}' installcheck-world" \
            --sysctl 'kernel.sem=500 1024000 200 4096' ghcr.io/stolb27/gpdb6_u22:${{ github.sha }} \
            bash /home/gpadmin/gpdb_src/concourse/scripts/ic_gpdb.bash
