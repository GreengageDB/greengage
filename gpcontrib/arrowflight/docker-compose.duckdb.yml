services:
  duckdb-flight:
    build:
      context: .
      dockerfile: tools/duckdb_flight/Dockerfile
    image: greengage-arrowflight-duckdb-flight:dev
    hostname: duckdb-flight
    ports:
      - "8815:8815"
      - "8816:8816"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8815), 2); s.close()"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  greengage:
    image: ${ARROWFLIGHT_GG_IMAGE:-greengage7-u22-arm64-build-arrowflight-test:latest}
    hostname: greengage
    privileged: true
    init: true
    user: root
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    ports:
      - "${ARROWFLIGHT_GG_PORT:-7000}:7000"
    depends_on:
      duckdb-flight:
        condition: service_healthy
    entrypoint: sleep
    command: infinity
