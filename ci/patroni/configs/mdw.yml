scope: test-cluster
namespace: /db/
name: mdw  # unique node name

restapi:
  # listen on all interfaces: the REST API is published to the host as 8008
  listen: 0.0.0.0:8008
  # container hostname -- resolvable inside the container and from other
  # services on the compose network
  connect_address: cdw:8008

etcd3:
  # `etcd` service of docker-compose-greengage.yml
  hosts:
    - etcd1:2379
    - etcd2:2379
    - etcd3:2379

# Enables the Greengage specifics: the coordinator is started with
# --gp_role=dispatch and max_prepared_transactions is never 0 (if not configured,
# it is set to max_connections). The section has no settings, its mere presence
# is the switch.
greengage: {}

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      # GUCs from Patroni's CMDLINE_OPTIONS live only here (i.e. in DCS), they are
      # ignored in `postgresql.parameters` below. Without them Patroni would start
      # the coordinator with its own defaults, e.g. max_connections=100, instead of
      # the values the gpdemo cluster was created with. bootstrap.dcs is written to
      # DCS only once, by the first member, later changes need `patronictl edit-config`.
      parameters:
        max_connections: 150
        max_prepared_transactions: 250
        # Greengage defaults, Patroni's are 64 and 8. The default of
        # max_worker_processes is 8 + MaxPMAuxProc: 12, or 13 if Greengage is
        # built with --enable-ic-proxy, as the ggdb7_ubuntu image is.
        max_locks_per_transaction: 128
        max_worker_processes: 13

postgresql:
  listen: 0.0.0.0:7000
  connect_address: cdw:7000
  # coordinator of the gpdemo cluster (PORT_BASE=7000 -> coordinator port 7000)
  data_dir: /home/gpadmin/.data/gpseg-1
  # GPHOME of the unpacked bin_gpdb.tar.gz
  bin_dir: /usr/local/greengage-db-devel/bin
  pgpass: /tmp/pgpass0

  # Patroni rewrites pg_hba.conf from this list on every start and on SIGHUP.
  # It has to live here rather than under `bootstrap`: bootstrap.pg_hba is only
  # applied when Patroni initdb's an empty data_dir, which never happens in this
  # setup (both nodes adopt the running gpdemo coordinators, a re-created node is
  # pg_basebackup'd).
  # NB: the file is replaced wholesale, so the gpadmin entries that the Greengage
  # utilities rely on have to be repeated here.
  pg_hba:
    - local all all trust
    # gpstart/gpstop/gpstate and segment -> coordinator connections
    - host all gpadmin 0.0.0.0/0 trust
    - host all gpadmin ::1/128 trust
    # Patroni's own superuser and pg_rewind connections
    - host all patroni 0.0.0.0/0 md5
    - host all rewind_user 0.0.0.0/0 md5
    # Streaming replication: the nodes reach each other over the container IP
    # (host=greengage), so a 127.0.0.1-only entry is not enough -- without this
    # line the walreceiver dies with "no pg_hba.conf entry for replication
    # connection from host ...".
    - host replication replicator 0.0.0.0/0 md5
    - host replication gpadmin samehost trust
    - host all all 0.0.0.0/0 md5

  # Patroni's connections to the coordinators must be utility mode ones (in dispatch
  # mode they fail on a freshly registered standby and pg_rewind silently breaks the
  # data directory), hence `-c gp_role=utility`. Patroni refuses to start without it
  # for the superuser and the rewind user. The replication user doesn't need it:
  # replication connections don't depend on gp_role.
  authentication:
    replication:
      username: replicator
      password: replicator_pass
    superuser:
      username: patroni
      password: patroni_pass
      options: -c gp_role=utility
    rewind:
      username: rewind_user
      password: rewind_pass
      options: -c gp_role=utility

  # NB: no `basebackup: target-gp-dbid` here. When the node is cloned, Patroni
  # registers it as the coordinator standby on the leader and passes the dbid
  # assigned there to pg_basebackup. The replication user must be able to read
  # all settings for Greengage's pg_basebackup (it runs `SHOW log_directory`):
  #   GRANT pg_read_all_settings TO replicator;

  # NB: parameters from the CMDLINE_OPTIONS list (max_connections,
  # max_prepared_transactions, max_locks_per_transaction, max_worker_processes,
  # wal_keep_size, ...) are silently ignored here, they are managed in DCS, see
  # bootstrap.dcs above.
  parameters:
    unix_socket_directories: '/tmp'

# Greengage supports only one coordinator standby, hence this Patroni cluster must
# consist of exactly mdw and smdw. Additional members aren't supported: they can't be
# registered as the standby, so pg_basebackup can't create them and Greengage wouldn't
# update gp_segment_configuration on their promotion. For the same reason the
# `replicatefrom` tag isn't supported, the standby must replicate from the leader.
tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false

# Patroni logs at INFO by default. For troubleshooting, e.g. to see the exact
# pg_basebackup command line or the DCS traffic, uncomment:
# log:
#   level: DEBUG
#   traceback_level: DEBUG
