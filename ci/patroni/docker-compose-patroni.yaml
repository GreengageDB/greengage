x-common-service: &common-service
  image: "${IMAGE}"
  privileged: true
  sysctls:
    kernel.sem: 500 1024000 200 4096
  init: true
  ulimits:
    nofile: 65535
  entrypoint: >
    sleep infinity

x-etcd-common: &etcd-common
  image: quay.io/coreos/etcd:v3.7.2
  # no TLS and no authentication -- local development only
  healthcheck:
    test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

services:

  etcd1:
    <<: *etcd-common
    container_name: etcd1
    command:
      - etcd
      - --name=etcd1
      # listen on all interfaces, so that both greengage and the host can reach it
      - --listen-client-urls=http://0.0.0.0:2379
      # Patroni discovers the endpoints from the member list, hence not localhost
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster-token=patroni-etcd
      - --initial-cluster-state=new
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
    ports:
      # expose etcd1 to the host as well (Patroni outside the container: 127.0.0.1:2379)
      - "2379:2379"
    networks:
      cluster_net:
        ipv4_address: 172.20.0.11

  etcd2:
    <<: *etcd-common
    container_name: etcd2
    command:
      - etcd
      - --name=etcd2
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster-token=patroni-etcd
      - --initial-cluster-state=new
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
    ports:
      - "12379:2379"
    networks:
      cluster_net:
        ipv4_address: 172.20.0.12

  etcd3:
    <<: *etcd-common
    container_name: etcd3
    command:
      - etcd
      - --name=etcd3
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster-token=patroni-etcd
      - --initial-cluster-state=new
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
    ports:
      - "22379:2379"
    networks:
      cluster_net:
        ipv4_address: 172.20.0.13

  cdw:
    <<: *common-service
    working_dir: /home/gpadmin
    hostname: cdw
    volumes:
      - ${PWD}/ssh_keys/id_rsa.pub:/home/gpadmin/.ssh/id_rsa.pub
      - ${PWD}/ssh_keys/id_rsa:/home/gpadmin/.ssh/id_rsa
      - ${PATRONI_DIR}:/home/gpadmin/patroni
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
    networks:
      cluster_net:
        ipv4_address: 172.20.0.21

  scdw:
    <<: *common-service
    working_dir: /home/gpadmin
    hostname: scdw
    volumes:
      - ${PWD}/ssh_keys/id_rsa.pub:/home/gpadmin/.ssh/id_rsa.pub
      - ${PWD}/ssh_keys/id_rsa:/home/gpadmin/.ssh/id_rsa
      - ${PATRONI_DIR}:/home/gpadmin/patroni
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
    networks:
      cluster_net:
        ipv4_address: 172.20.0.22

  sdw1:
    <<: *common-service
    hostname: sdw1
    volumes:
      - ${PWD}/ssh_keys/id_rsa.pub:/home/gpadmin/.ssh/id_rsa.pub
      - ${PWD}/ssh_keys/id_rsa:/home/gpadmin/.ssh/id_rsa
    networks:
      cluster_net:
        ipv4_address: 172.20.0.31
  sdw2:
    <<: *common-service
    hostname: sdw2
    volumes:
      - ${PWD}/ssh_keys/id_rsa.pub:/home/gpadmin/.ssh/id_rsa.pub
      - ${PWD}/ssh_keys/id_rsa:/home/gpadmin/.ssh/id_rsa
    networks:
      cluster_net:
        ipv4_address: 172.20.0.32
  sdw3:
    <<: *common-service
    hostname: sdw3
    volumes:
      - ${PWD}/ssh_keys/id_rsa.pub:/home/gpadmin/.ssh/id_rsa.pub
      - ${PWD}/ssh_keys/id_rsa:/home/gpadmin/.ssh/id_rsa
    networks:
      cluster_net:
        ipv4_address: 172.20.0.33

networks:
  cluster_net:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
